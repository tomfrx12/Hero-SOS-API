services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env.prod}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - web

  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks:
      - web

  api:
    build:
      context: .
      target: production
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env.prod}
      FRONTEND_URL: https://${FRONT_DOMAIN:?FRONT_DOMAIN manquant dans .env.prod}
      PORT: 3000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:?TRAEFIK_NETWORK manquant dans .env.prod}
      - traefik.http.routers.hero-sos-api.rule=Host(`${API_DOMAIN:?API_DOMAIN manquant dans .env.prod}`)
      - traefik.http.routers.hero-sos-api.entrypoints=${TRAEFIK_ENTRYPOINT:?TRAEFIK_ENTRYPOINT manquant dans .env.prod}
      - traefik.http.routers.hero-sos-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:?TRAEFIK_CERTRESOLVER manquant dans .env.prod}
      - traefik.http.services.hero-sos-api.loadbalancer.server.port=3000
    volumes:
      - uploads_data:/app/uploads
    networks:
      - web
      - traefik

  front:
    build:
      context: ../Hero-SOS
      args:
        VITE_API_URL: https://${API_DOMAIN}
    restart: unless-stopped
    depends_on:
      - api
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.hero-sos-front.rule=Host(`${FRONT_DOMAIN}`)
      - traefik.http.routers.hero-sos-front.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.hero-sos-front.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.services.hero-sos-front.loadbalancer.server.port=80
    networks:
      - traefik

networks:
  web:
  traefik:
    name: ${TRAEFIK_NETWORK}
    external: true

volumes:
  postgres_data:
  uploads_data:
